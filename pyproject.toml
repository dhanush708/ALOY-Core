[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aloy"
version = "1.0.0"
description = "ALOY — Local-First Personal AI Companion"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Dhanush A.", email = "anbudhanush31@gmail.com" }
]
keywords = ["ai", "local", "ollama", "personal-ai", "llm", "agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.1",
    "uvicorn[standard]==0.29.0",
    "pyyaml>=6.0",
    "httpx==0.27.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "sqlite-vec==0.1.6",
    "sse-starlette==2.1.0",
    "tiktoken>=0.5.0",
    "psutil>=5.9.0",
    "aiofiles>=23.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/dhanush708/aloy"
"Bug Tracker" = "https://github.com/dhanush708/aloy/issues"
Documentation = "https://github.com/dhanush708/aloy/blob/main/README.md"

[project.scripts]
aloy = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "api*", "models*", "memory*", "identity*", "kernel*",
    "tools*", "security*", "evolution*", "database*",
    "agent*", "conversation*", "knowledge*", "learning*",
    "reasoning*", "project*", "config*"
]

[tool.setuptools.package-data]
"*" = ["*.sql", "*.yaml", "*.yml"]
